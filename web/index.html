<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="CPSA: cosa vede l'IA sulla Kria KV260." />
    <title>CPSA · Cosa vede l'IA</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <p class="wordmark">CPSA</p>
        <h1 class="title">Cosa vede l'IA</h1>

        <div class="readout">
          <span class="conn" id="conn">
            <span id="conn-dot" class="dot dot-connecting" aria-hidden="true"></span>
            <span id="conn-text" class="conn-text">Connessione…</span>
          </span>
          <span class="gauge" id="fps" title="Fotogrammi analizzati al secondo">— fps</span>
          <span class="gauge" id="latency" title="Tempo di elaborazione del fotogramma"
            >— ms</span
          >
        </div>
      </header>

      <p id="notice" class="notice" role="status" aria-live="polite"></p>

      <main class="stage">
        <section class="pane pane-camera" aria-labelledby="camera-title">
          <h2 id="camera-title" class="sr-only">Telecamera RGB</h2>
          <div class="frame">
            <img id="video" class="video" alt="Video della telecamera RGB" hidden />
            <p id="video-note" class="frame-note">In attesa della telecamera…</p>
            <span class="frame-badge" aria-hidden="true">RGB</span>
          </div>
        </section>

        <section
          class="pane pane-view pane-showcase"
          id="view-showcase"
          aria-labelledby="showcase-title"
        >
          <h2 id="showcase-title" class="sr-only">Cosa vede l'IA</h2>
          <div class="showcase">
            <section class="showcase-group" id="showcase-counts-group">
              <h3 class="showcase-heading">Oggetti nell'inquadratura</h3>
              <ul class="showcase-counts" id="showcase-counts"></ul>
            </section>
            <section class="showcase-group" id="showcase-objects-group">
              <h3 class="showcase-heading">Rilevamenti più sicuri</h3>
              <ul class="showcase-objects" id="showcase-objects"></ul>
            </section>
          </div>
          <p class="view-note" id="showcase-empty">Mostra un oggetto alla telecamera</p>
          <p class="view-meta" id="showcase-meta"></p>
        </section>
      </main>

      <noscript>Questa dashboard richiede JavaScript.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
