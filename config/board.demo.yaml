# CPSA medical demo configuration for the KV260 (config/board.demo.yaml).
#
# This is config/board.yaml specialized for the Thursday demo:
# - the DPU xmodel pose backend at 512x384,
# - the web dashboard on 0.0.0.0:8080, with the medical mode as the default,
# - evidence and logs under /home/kria/cpsa/runs/.
#
# `server` and `supervisor` are the F6 sections consumed by `cpsa-supervisor`.
# See deploy/README.md for installation and the board-side checks.
log:
  base_path: /home/kria/cpsa/runs/logs  # system.log and events.jsonl go under <base_path>/<YYYY-MM-DD>/
  level: INFO                           # DEBUG, INFO, WARNING, ERROR or CRITICAL

bluecoins:
  left: CPSA_L2                    # BLE name of the left-wrist BlueCoin
  right: CPSA_R2                   # BLE name of the right-wrist BlueCoin
  scan_timeout_s: 5                # duration of each discovery scan
  discovery_retries: 5             # extra scans before giving up (exit code 2)
  retry_interval_s: 5              # wait between scans

sync:
  max_skew_ms: 30                  # max L/R timestamp difference to combine samples
  stale_ms: 50                     # discard a wrist's samples older than this

dispatch:
  cooldown_s: 5                    # min time between actuations for the same tag
  verification_deadline_s: 1.0     # placeholder (Q-01): measure with a real verifier

actuators:
  retry:                           # shared reconnection behavior of every actuator
    scan_timeout_s: 5
    fast_attempts: 5
    interval_s: 5
    sleep_s: 60
  metamotion:
    enable: true
  speaker:
    enable: false
    mac: "D4:8C:49:C9:DC:9A"
  led_strip:
    enable: false
    duration_ms: 2500              # LED turns itself off after this time

camera:                            # Creative VF0800 (Intel RealSense F200) over V4L2
  rgb_device: auto                 # auto: RealSense node offering YUYV without Z16
  depth_device: auto               # auto: RealSense node offering Z16 (survives a re-plug)
  width: 640                       # frames are captured at the model input size
  height: 480
  fps: 30
  rgb_exposure: 300                # manual exposure_time_absolute in 83..10000
  xu:                              # depth extension-unit values, applied on every open
    laser_power: 16                # 0..16
    accuracy: 2                    # 1..3
    filter: 6                      # 0..7
    confidence: 1                  # 0..15

vision:                            # 2D pose episode analysis on the KV260 DPU
  enabled: true                    # medical mode needs the pose verifier
  layout: HALFBUST_62              # pose keypoint layout: HALFBUST_62 or COCO17
  model:
    kind: xmodel                   # onnx (CPU stand-in) or xmodel (KV260 DPU)
    path: models/pose_halfbust62.xmodel  # relative to /home/kria/cpsa (WorkingDirectory)
    # The random-weights bring-up model (video-pipeline/build/vitis/compiled/
    # pose_halfbust62.xmodel) was compiled at 480x640. For that model only, set
    # input_width: 640 and input_height: 480; the trained model uses 512x384.
    input_width: 512               # model input size, pixels (width x height)
    input_height: 384
    conf_thr: 0.25                 # minimum person score
    iou_thr: 0.45                  # NMS IoU threshold
  camera:                          # RGB-only UVC node used by the vision pipeline
    device: auto                   # auto: pick the node by card name (USB re-plug safe)
    match: RealSense               # card-name fragment for auto; the kernel truncates
                                   # the F200 card to "Intel(R) RealSense(TM) 3D Camer"
    width: 640
    height: 480
    fps: 30
    exposure: 300                  # manual exposure_time_absolute in 1..10000 (100 us units)
    gain: 160                      # manual V4L2 gain (F200 64..2540); dim booth light, 8.7% saturated
    power_line_hz: 50              # anti-flicker for 50 Hz mains (Italy): 0 off, 50, 60
  preroll_s: 3.0                   # bounded RAM ring of raw camera frames
  lookback_s: 1.0                  # pre-roll included in an assessment window
  fast_after_s: 0.2                # live analysis after the detection window end
  fast_budget_s: 0.8               # stage-1 budget; must be < dispatch.verification_deadline_s
  idle_timeout_s: 3.0              # end an episode after this long without a detection
  stale_after_s: 0.5               # a frame older than this makes the source unhealthy
  analysis_fps: 30                 # deterministic analyzed-frame grid (P-06); 30 = every camera frame
  queue_max: 8                     # bounded analysis queue; oldest frame dropped when full
  imu_buffer_s: 10.0               # per-side ACC magnitude buffer used by the episode report
  evidence:
    enabled: false                 # no clips of visitors' faces at the booth (2026-11-11)
    base_path: /home/kria/cpsa/runs/evidence
    clip_s: 2.0                    # clip centred on the peak-severity contact
    retention_days: 7              # day folders older than this are purged
  tracker:
    filter: false                  # raw detections, no Kalman filter (2026-11-11 demo decision);
                                   # without it the speed-based danger rules never fire
    min_conf: 0.3
    gate_chi2: 9.21
    max_predict_frames: 5
    meas_std_px: 3.0
    jerk_std_pxps3: 1000.0
    init_pos_std_px: 20.0
    init_vel_std_pxps: 1000.0
    init_acc_std_pxps2: 10000.0
    subject:
      rule: largest                # largest or central
      full_body_ratio: 9.0         # person-box height / face width
      face_anchor_conf: 0.3
      wrist_conf: 0.3
      face_width_source: auto      # jaw, ears, eyes or auto
      eye_to_face_ratio: 2.2
      face_width_window: 15
    skeleton:
      max_ratio: 1.4               # reject bones longer than this times the reference
      ref_conf: 0.5
      ref_frames: 60
      ref_min_frames: 30
      check_conf: 0.3
  analysis:
    approach_fw: 0.4               # hand-to-face approach distance in face-widths
    approach_speed_fwps: 1.0
    min_framed_fraction: 0.6       # framed share required for a REJECTED verdict
    max_gap_s: 0.2                 # largest allowed hole in the analyzed window
    activity_window_s: 3.0         # episode activity window for follow-ups and labels
    repetition_band_hz: [0.2, 5.0]
    features:
      hand_conf: 0.3
      face_conf: 0.3
      occlusion_conf: 0.3
      forehead_margin_fw: 0.1
    contacts:
      contact_enter_fw: 0.15
      contact_exit_fw: 0.25
      occlusion_contact: 0.6
      occlusion_near_fw: 0.5
      min_duration_s: 0.1
      approach_window_s: 0.3
      recoil_window_s: 0.3
    hand_shape:
      extended_ratio: 1.4
      pinch_ratio: 0.3
      min_conf: 0.3
      min_keypoints: 15
    oscillation:
      rocking_band_hz: [0.5, 2.0]
      flapping_band_hz: [2.0, 6.0]
      rocking_min_strength: 0.5
      rocking_min_amp_fw: 0.05
      flapping_min_strength: 0.5
      flapping_height_margin_fw: 0.5
      min_conf: 0.3
      min_samples: 8
    severity:
      dangerous_regions: [eyes]           # FaceRegion names
      dangerous_shapes: [fist, point_pinch]  # HandShape names
      shape_speed_fwps: 1.0
      strike_speed_fwps: 2.0
      strike_decel_fwps2: 4.0
      recoil_fw: 0.05

# F6: web dashboard server. Paths are relative to /home/kria/cpsa.
server:
  host: 0.0.0.0
  port: 8080
  static_dir: web/dist
  idle_timeout_s: 30
  video: true                     # live camera frames on /video.mjpeg (F14, demo only)

# F6: mode selected by cpsa-supervisor at startup.
supervisor:
  default_mode: medical           # idle | medical

# Camera-only medical mode (FR-026): the BlueCoins are never scanned or connected,
# and the vision trigger starts and ends the episodes instead of the IMU.
medical:
  trigger: vision
  vision_trigger:
    min_contacts: 2               # N: contacts within the window that start an episode
    contact_window_s: 10.0        # T: seconds the N contacts must fall within
    oscillation_min_s: 3.0        # D: seconds of continuous rocking or flapping
    refractory_s: null            # no new start this long after an episode ends; null = dispatch.cooldown_s

# Hands demos (T4): the `hologram` and `rps` modes share one IR hand perception
# chain. The medical keys above are untouched by this section.
hands:
  model:
    path: models/hand21_topdown.xmodel  # compiled HAND21 pose model (256x320)
    input_height: 256             # compiled graph size, pixels
    input_width: 320
    conf_thr: 0.25                # minimum hand score
    iou_thr: 0.45                 # NMS IoU threshold
  camera:
    match: RealSense              # card-name fragment of the INZI IR/depth node
    fps: 30                       # INZI rate and perception cap; try 60 once INZI@60 is confirmed on the board
  intrinsics:                     # nominal F200 IR pinhole until a calibration exists
    fx: 430
    fy: 430
    cx: 320
    cy: 240
  depth:
    scale_m: 3.125e-5             # raw Z16 to metres: depth_m = raw * scale_m + offset_m
    offset_m: 0
  rps:
    classifier_path: models/rps_mlp.npz  # 42-64-64-4 classifier exported by cpsa_ml.gestures
    ready_s: 0.5                  # one hand visible this long starts the countdown
    countdown_step_s: 0.7         # per countdown step (3, 2, 1)
    shoot_s: 0.4                  # majority-vote window after "1"
    result_s: 3.0                 # how long win/lose/draw/unclear stays on screen
    score_reset_s: 20.0           # score reset after this long without a hand
    min_share: 0.6                # minimum vote share for a recognized gesture
